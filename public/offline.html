<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sin Conexión | Casa Tuning</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0A0A0C;
      color: #EDEDED;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(17, 17, 19, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      padding: 40px 28px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      display: block;
      border-radius: 16px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: #FFFFFF;
      margin-bottom: 12px;
    }
    p {
      font-size: 0.95rem;
      color: #9898A6;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background: #C9A84C;
      color: #0A0A0C;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 12px 28px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s ease, transform 0.1s ease;
    }
    .btn:hover {
      background: #D8B75B;
    }
    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="/icon-192x192.png" alt="Casa Tuning" class="logo" />
    <h1>Sin conexión a Internet</h1>
    <p>No se pudo conectar con el servidor de Casa Tuning. Por favor, revisa tu conexión e inténtalo de nuevo.</p>
    <button class="btn" onclick="window.location.reload()">Reintentar conexión</button>
  </div>
</body>
</html>
